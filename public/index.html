<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Our Weekly Planner</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>

  <!-- Login -->
  <main id="login-view" class="login-view" hidden>
    <div class="login-card">
      <h1>🌸 Our Weekly Planner</h1>
      <p class="subtitle">Log in to view and edit the plan</p>
      <form id="login-form">
        <label for="username">Who's logging in?</label>
        <select id="username" name="username" required>
          <option value="" disabled selected>Choose…</option>
          <option value="Jo">Jo</option>
          <option value="Adam">Adam</option>
        </select>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" required autocomplete="current-password" />

        <button type="submit">Log in</button>
        <p id="login-error" class="error" hidden></p>
      </form>
    </div>
  </main>

  <!-- App -->
  <div id="app-view" class="app-view" hidden>
    <header class="topbar">
      <h1>🌸 Our Weekly Planner</h1>
      <div class="topbar-right">
        <div class="search-box">
          <input id="search-input" type="search" placeholder="Search the plan…" aria-label="Search the plan" />
          <span id="search-count" class="search-count"></span>
        </div>
        <span id="status-indicator" class="status">Loading…</span>
        <span id="whoami" class="whoami"></span>
        <button id="logout-btn" class="ghost-btn">Log out</button>
      </div>
    </header>

    <main class="content">
      <section class="daily-section" id="daily-section">
        <!-- daily view card injected by app.js -->
      </section>

      <section class="grid-section">
        <div class="table-scroll">
          <table id="plan-table" class="plan-table" aria-label="Weekly schedule"></table>
        </div>
      </section>

      <section class="meals-section">
        <div class="meals-card">
          <h2>🍽️ Meal plan</h2>
          <div class="table-scroll">
            <table id="meals-table" class="meals-table" aria-label="Weekly meal plan"></table>
          </div>
        </div>

        <div class="meals-columns">
          <div class="recipes-card">
            <div class="card-header">
              <h2>📖 Recipe box</h2>
              <button type="button" id="add-recipe-btn" class="ghost-btn">+ Add recipe</button>
            </div>
            <form id="recipe-form" class="recipe-form" hidden>
              <input id="recipe-name-input" type="text" placeholder="Recipe name" required />
              <textarea id="recipe-ingredients-input" placeholder="One ingredient per line…" rows="4"></textarea>
              <div class="form-actions">
                <button type="submit" class="ghost-btn primary">Save recipe</button>
                <button type="button" id="cancel-recipe-btn" class="ghost-btn">Cancel</button>
              </div>
            </form>
            <div id="recipes-list" class="recipes-list"></div>
          </div>

          <div class="shopping-card">
            <div class="card-header">
              <h2>🛒 Shopping list</h2>
              <button type="button" id="generate-shopping-btn" class="ghost-btn">Generate from meals</button>
            </div>
            <div id="shopping-list" class="shopping-list"></div>
            <form id="add-item-form" class="add-item-form">
              <input id="new-item-input" type="text" placeholder="Add an item…" />
              <button type="submit" class="ghost-btn">Add</button>
            </form>
            <button type="button" id="clear-checked-btn" class="ghost-btn small">Clear checked</button>
          </div>
        </div>
      </section>

      <section class="notes-section" id="notes-section">
        <!-- note cards injected by app.js -->
      </section>
    </main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
